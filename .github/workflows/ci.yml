name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  server:
    name: Backend Test & Build
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:8
        ports:
          - 27017:27017

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install server dependencies
        working-directory: server
        run: npm ci

      - name: Server Typecheck
        working-directory: server
        run: npm run typecheck

      - name: Server Automated Tests
        working-directory: server
        env:
          MONGODB_URI: mongodb://127.0.0.1:27017/ci_test
          JWT_SECRET: ci_test_secret_key_venturecraft_2026_at_least_32_chars_long
          NODE_ENV: test
        run: npm test

      - name: Server Production Build
        working-directory: server
        run: npm run build

  client:
    name: Frontend Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install client dependencies
        working-directory: client
        run: npm ci

      - name: Client Typecheck & Build
        working-directory: client
        run: npm run build
